<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSR Blox Strike - Tierlist</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Animasyonlu Arka Plan Renk Geçişi */
    body {
      background: linear-gradient(-45deg, #0b0f19, #111827, #1e1b4b, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Top Bar & Language Selector */
    .top-bar {
      max-width: 1000px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      justify-content: flex-end;
    }

    .lang-btn {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .lang-btn:hover {
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    /* Header Styling */
    .header {
      text-align: center;
      max-width: 1000px;
      margin: 0 auto 2.5rem auto;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      letter-spacing: -0.5px;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .header p {
      color: #94a3b8;
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    /* MCPVP Style List Container */
    .list-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* MCPVP Kart Yapısı ve Açılış Animasyonu */
    .mcpvp-card {
      position: relative;
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s ease forwards;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mcpvp-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
      transform: scale(1.01) translateX(4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(56, 189, 248, 0.15);
    }

    /* Sol Taraftaki Sıralama / Rank Kutusu */
    .rank-num {
      font-size: 1.2rem;
      font-weight: 800;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      margin-right: 1rem;
    }

    .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
    .rank-3 { background: linear-gradient(135deg, #b45309, #78350f); color: #fff; }

    .player-left {
      display: flex;
      align-items: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      margin-right: 1rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #0f172a;
      border: 2px solid #38bdf8;
    }

    .username {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .player-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .info-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .info-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
    }

    .badge {
      padding: 0.3rem 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-block;
    }

    /* Animasyonlu Rozetler */
    .badge-tier { 
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2)); 
      color: #60a5fa; 
      border: 1px solid rgba(59, 130, 246, 0.4); 
    }
    .badge-role { 
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2)); 
      color: #c084fc; 
      border: 1px solid rgba(168, 85, 247, 0.4); 
    }
    .badge-year { 
      color: #94a3b8; 
      font-weight: 600; 
      background: rgba(255, 255, 255, 0.05);
    }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 3rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">🌐 TR / EN</button>
  </div>

  <div class="header">
    <h1 id="txt-title">🏆 NSR Blox Strike Leaderboard</h1>
    <p id="txt-subtitle">Live synchronized with Discord Bot</p>
  </div>

  <div class="list-container" id="player-list">
    <div class="loading" id="txt-loading">Loading leaderboard...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://nsr-tierlist-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentLang = 'en';

    const translations = {
      en: {
        title: "🏆 NSR Blox Strike Leaderboard",
        subtitle: "Live synchronized with Discord Bot",
        loading: "Loading leaderboard...",
        empty: "No players registered yet.",
        tier: "Tier",
        role: "Role",
        joined: "Joined"
      },
      tr: {
        title: "🏆 NSR Blox Strike Sıralaması",
        subtitle: "Discord Botu ile canlı senkronize",
        loading: "Sıralama yükleniyor...",
        empty: "Henüz kayıtlı oyuncu yok.",
        tier: "Aşama",
        role: "Rol",
        joined: "Katılım"
      }
    };

    window.toggleLanguage = function() {
      currentLang = currentLang === 'en' ? 'tr' : 'en';
      const t = translations[currentLang];
      document.getElementById('txt-title').innerText = t.title;
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      renderData(window.lastData);
    };

    const playersRef = ref(db, 'players');
    const container = document.getElementById('player-list');

    onValue(playersRef, (snapshot) => {
      window.lastData = snapshot.val();
      renderData(window.lastData);
    });

    function renderData(data) {
      const t = translations[currentLang];
      container.innerHTML = '';

      if (!data) {
        container.innerHTML = `<div class="loading">${t.empty}</div>`;
        return;
      }

      // Benzersiz kullanıcı isimlerine göre filtreleme (Çiftleri Önler)
      const uniquePlayers = {};
      Object.values(data).forEach(p => {
        if (p && p.username) {
          uniquePlayers[p.username.toLowerCase()] = p;
        }
      });

      const playerArray = Object.values(uniquePlayers);

      playerArray.forEach((player, index) => {
        const avatar = player.avatarUrl && player.avatarUrl.length > 5 
          ? player.avatarUrl 
          : `https://tr.rbxcdn.com/30DAY-AvatarHeadshot-PNG`;

        const item = document.createElement('div');
        item.className = 'mcpvp-card';
        
        // Açılış gecikme animasyonu
        item.style.animationDelay = `${index * 0.08}s`;

        // Rank sınıfı belirleme (1, 2, 3 özel renkler)
        let rankClass = '';
        if (index === 0) rankClass = 'rank-1';
        else if (index === 1) rankClass = 'rank-2';
        else if (index === 2) rankClass = 'rank-3';

        item.innerHTML = `
          <div class="player-left">
            <div class="rank-num ${rankClass}">${index + 1}</div>
            <div class="avatar-wrapper">
              <img src="${avatar}" alt="${player.username}" class="avatar" onerror="this.src='https://via.placeholder.com/100'">
            </div>
            <div class="username">${player.username}</div>
          </div>
          <div class="player-right">
            <div class="info-box">
              <span class="info-label">${t.tier}</span>
              <span class="badge badge-tier">${player.tier || 'T5'}</span>
            </div>
            <div class="info-box">
              <span class="info-label">${t.role}</span>
              <span class="badge badge-role">${player.dcRole || 'MEMBER'}</span>
            </div>
            <div class="info-box">
              <span class="info-label">${t.joined}</span>
              <span class="badge badge-year">${player.createdYear || '-'}</span>
            </div>
          </div>
        `;

        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
